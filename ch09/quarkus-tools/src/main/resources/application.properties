quarkus.http.host=127.0.0.1
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_MODEL}
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.timeout=10s
quarkus.langchain4j.openai.max-retries=1
quarkus.redis.devservices.enabled=false
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.rest-client.hotel-catalog.url=${HOTEL_CATALOG_URL:http://localhost:8082}
