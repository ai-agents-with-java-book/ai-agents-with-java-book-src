quarkus.http.port=8080

quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true
quarkus.langchain4j.chat-model.provider=openai

quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.timeout=180s

#Observability
quarkus.otel.logs.enabled=true
quarkus.otel.traces.enabled=true
%test.quarkus.observability.enabled=false
quarkus.otel.exporter.otlp.traces.headers=authorization=Bearer my_secret
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n

# LangSmith (activate with -Dquarkus.profile=langsmith)
%langsmith.quarkus.otel.exporter.otlp.protocol=http/protobuf
%langsmith.quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
%langsmith.quarkus.otel.exporter.otlp.traces.endpoint=${LANGSMITH_OTLP_ENDPOINT:https://api.smith.langchain.com/otel}
%langsmith.quarkus.otel.exporter.otlp.traces.headers=x-api-key=${LANGSMITH_API_KEY},Langsmith-Project=${LANGSMITH_PROJECT:expert-chatbot}
%langsmith.quarkus.otel.traces.sampler=parentbased_always_on
%langsmith.quarkus.langchain4j.tracing.include-prompt=true
%langsmith.quarkus.langchain4j.tracing.include-completion=true
%langsmith.quarkus.langchain4j.tracing.include-tool-arguments=true
%langsmith.quarkus.langchain4j.tracing.include-tool-result=true
%langsmith.quarkus.observability.enabled=false
%langsmith.quarkus.micrometer.export.otlp.enabled=false
