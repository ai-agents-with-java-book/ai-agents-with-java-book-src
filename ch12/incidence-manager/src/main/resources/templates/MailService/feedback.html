{@org.acme.CustomerSupportInformation customerSupportInformation}
<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>Nice to hear from you!</title>
</head>

<body style="margin:0;padding:0;background-color:#060b1f;font-family:Arial,Helvetica,sans-serif;">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#060b1f;">
    <tr>
        <td align="center">

            <table role="presentation" width="700" cellspacing="0" cellpadding="0" border="0" style="width:700px;max-width:700px;background-color:#0d1435;border-radius:16px;overflow:hidden;">

                <tr>
                    <td align="center" style="padding:40px 20px 20px 20px;background:linear-gradient(180deg,#101c4d,#0d1435);">

                        <img src="cid:logo@quarkus.io"
                             alt="Galactic Trips"
                             width="120"
                             style="display:block;border:0;">

                        <h1 style="margin:20px 0 10px 0;color:#ffffff;font-size:32px;font-weight:bold;">
                            It is nice to hear from you {customerSupportInformation.user}
                        </h1>

                        <p style="margin:0;color:#c9d4ff;font-size:16px;line-height:24px;">
                            {customerSupportInformation.response}
                        </p>

                    </td>
                </tr>

                <tr>
                    <td align="center"
                        style="padding:30px;background-color:#080d26;border-top:1px solid #27336d;">

                        <p style="margin:0;color:#7f8cc7;font-size:12px;line-height:20px;">
                            Galactic Trips Interplanetary Transport Authority
                            <br>
                            Safe travels across the Solar System.
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
