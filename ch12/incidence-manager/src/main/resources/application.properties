quarkus.http.port=8888

quarkus.docling.devservices.enabled=false
quarkus.docling.base-url=http://localhost:1234

quarkus.quinoa.package-manager-install.node-version=20.10.0
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.ui-root-path=quinoa

%prod.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/galaxium_booking}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.jdbc.statement-batch-size=20

quarkus.langchain4j.ollama.chat-model.model-name=qwen3:1.7b 
quarkus.langchain4j.ollama.chat-model.temperature=0 
quarkus.langchain4j.timeout=120s

####### Quarkus Flow

# Kafka
quarkus.flow.messaging.defaults-enabled=true
quarkus.flow.messaging.devservices-messaging-enabled=true

